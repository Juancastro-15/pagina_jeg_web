<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peticiones de Oración | Iglesia Jehová es Gloria</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Header / Barra de Navegación -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="\images\logo.png" alt="Logo Iglesia Jehová es Gloria" class="w-[60px] h-[60px] object-cover rounded-full shadow-md border border-blue-200">
                <span class="text-xl font-bold text-blue-700">Jehová es Gloria</span>
            </div>
            <nav class="hidden md:flex space-x-6 font-medium text-sm">
                <a href="index.html" class="text-slate-600 hover:text-blue-800 transition">Inicio</a>
                <a href="sermons.html" class="text-slate-600 hover:text-blue-800 transition">Prédicas</a>
                <a href="events.html" class="text-slate-600 hover:text-blue-800 transition">Eventos</a>
                <a href="prayer.html" class="text-slate-600 hover:text-blue-800 transition">Oración</a>
            </nav>
            <a href="index.html#location" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-md transition">
                Contacto
            </a>
        </div>
    </header>

    <!-- Formulario de Oración -->
    <main class="max-w-xl mx-auto px-6 py-12">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
            <div class="text-center space-y-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Intercesión</span>
                <h1 class="text-3xl font-extrabold text-slate-900">Peticiones de Oración</h1>
                <p class="text-slate-600 text-sm">Nuestros pastores y equipo de intercesión estarán orando por tu petición.</p>
            </div>

            <form id="prayer-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tu Nombre</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Ej. Juan Pérez">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tu Petición</label>
                    <textarea id="request" rows="4" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" placeholder="Escribe aquí tu motivo de oración..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">
                    Enviar Petición 🙏
                </button>
            </form>
            <div id="response-message" class="hidden text-center text-sm font-medium mt-4"></div>
        </div>
    </main>

    <!-- Script de Envío -->
    <script>
        document.getElementById("prayer-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const request = document.getElementById("request").value;
            const msgBox = document.getElementById("response-message");

            try {
                const res = await fetch("/api/prayers", { // Ruta de tu API de oraciones
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, request })
                });

                if (res.ok) {
                    msgBox.className = "text-center text-sm font-medium mt-4 text-green-600";
                    msgBox.textContent = "¡Tu petición ha sido enviada con éxito! Estaremos orando por ti.";
                    document.getElementById("prayer-form").reset();
                } else {
                    throw new Error("Error al enviar");
                }
            } catch (err) {
                msgBox.className = "text-center text-sm font-medium mt-4 text-red-600";
                msgBox.textContent = "Hubo un error al enviar la petición. Inténtalo nuevamente.";
            }
            msgBox.classList.remove("hidden");
        });
    </script>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-20">
        <p>&copy; 2026 Iglesia Internacional Jehová es Gloria. Todos los derechos reservados.</p>
    </footer>

</body>
</html>

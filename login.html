<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Admin Jehová es Gloria</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #1e3a8a, #3b82f6, #1d4ed8, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
    </style>
</head>
<body class="animated-bg relative font-sans text-slate-800 flex items-center justify-center min-h-screen p-4">

    <!-- Contenedor del Login -->
    <div class="relative z-10 max-w-md w-full bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-slate-200/80 space-y-6">
        <div class="text-center space-y-2">
            <img src="images/logo.png" alt="Logo" class="w-[100px] h-[100px] object-cover rounded-full mx-auto border-2 border-blue-600 shadow-md">
            <h1 class="text-2xl font-extrabold text-slate-900">Panel Administrativo</h1>
            <p class="text-slate-500 text-sm">Ingresa tus credenciales para gestionar el contenido.</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-white" placeholder="admin@jehovaesgloria.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-white" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition text-sm">
                Ingresar al Sistema 🔑
            </button>
        </form>

        <div id="login-msg" class="hidden text-center text-sm font-medium p-3 rounded-xl"></div>
        
        <div class="text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-blue-600 transition">← Volver al sitio web</a>
        </div>
    </div>

    <!-- Script de Autenticación -->
    <script>
        // URL de tu backend desplegado en Render (sin barra al final)
        const API_URL = "https://pagina-jeg-web.onrender.com";

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const msgBox = document.getElementById("login-msg");

            try {
                // Conectando correctamente a la URL absoluta de Render
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Guardamos el token JWT en el navegador
                    localStorage.setItem("token", data.token);
                    
                    msgBox.className = "text-center text-sm font-medium p-3 rounded-xl bg-green-50 text-green-700 border border-green-200";
                    msgBox.textContent = "¡Inicio de sesión exitoso! Redirigiendo...";
                    msgBox.classList.remove("hidden");

                    // Redirigir al dashboard de administración tras 1 segundo
                    setTimeout(() => {
                        window.location.href = "admin.html";
                    }, 1000);
                } else {
                    throw new Error(data.error || "Credenciales inválidas");
                }
            } catch (err) {
                msgBox.className = "text-center text-sm font-medium p-3 rounded-xl bg-red-50 text-red-700 border border-red-200";
                msgBox.textContent = err.message;
                msgBox.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
